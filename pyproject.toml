[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sidecar_tagger"
version = "0.1.0"  # Static until change 2 adds __version__ to __init__.py
description = "CLI tool for generating sidecar metadata files with AI-powered analysis"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
authors = [
    {name = "Latai Community", email = "latai-community@example.com"}
]
keywords = ["sidecar", "metadata", "exiftool", "ai", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

dependencies = [
    "google-genai==1.68.0",
    "python-dotenv==1.0.1",
    "pdfplumber==0.11.4",
    "openpyxl==3.1.5",
    "Pillow==11.0.0",
    "fastembed==0.7.4",
    "pydantic==2.10.3",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
]

[project.scripts]
sidecar-tag = "cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["cli", "sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.uv]
# uv-specific configuration (resolution strategy, indexes, etc.)
